name: CI-Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # opencascade is not available on macOS
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libgl1-mesa-dev libglu1-mesa-dev

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        # v2025.09.17
        vcpkgGitCommitId: '4334d8b4c8916018600212ab4dd4bbdc343065d1'  

    - name: Export GitHub Actions cache environment variables for vcpkg
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Build (Release)
      uses: lukka/run-cmake@v10
      with:
        configurePreset: 'release-preset'
        buildPreset: 'release-preset'

    - name: Build (Debug)
      uses: lukka/run-cmake@v10
      with:
        configurePreset: 'debug-preset'
        buildPreset: 'debug-preset'

    - name: Upload artifacts (Release)
      uses: actions/upload-artifact@v4
      with:
        name: STEPToPoints-${{ matrix.os }}-Release
        path: |
          build/release/STEPToPoints
          build/release/STEPToPoints.exe
          build/release/Release/STEPToPoints.exe
        if-no-files-found: ignore

    - name: Upload artifacts (Debug)
      uses: actions/upload-artifact@v4
      with:
        name: STEPToPoints-${{ matrix.os }}-Debug
        path: |
          build/debug/STEPToPoints
          build/debug/STEPToPoints.exe
          build/debug/Debug/STEPToPoints.exe
        if-no-files-found: ignore
